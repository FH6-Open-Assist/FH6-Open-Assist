name: Sugerir uma melhoria
description: Proponha uma alteração de comportamento, interface ou novo fluxo.
title: "[Melhoria]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: component
    attributes:
      label: Área afetada
      options:
        - Skill Points
        - Farm de CR
        - WheelSpin Mad Mike
        - Gastar Wheelspins
        - Visão, OCR ou treinamento
        - Entrada ou segundo plano
        - Interface
        - Distribuição
        - Outro
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Qual problema você quer resolver?
      description: Explique a necessidade antes de descrever a solução.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução sugerida
      description: Descreva o comportamento esperado e as telas envolvidas.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Opcionalmente, explique outras abordagens avaliadas.
  - type: textarea
    id: safety
    attributes:
      label: Estado seguro esperado
      description: Explique o que o BOT deve fazer quando a tela, leitura ou contexto não puder ser confirmado.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmação
      options:
        - label: Verifiquei que não existe uma solicitação aberta equivalente.
          required: true
