name: Relatar um problema
description: Informe uma falha reproduzível em um dos BOTs.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o FH6 Open Assist. Remova dados pessoais dos logs e imagens antes de enviar.
  - type: dropdown
    id: bot
    attributes:
      label: BOT
      options:
        - Skill Points
        - Farm de CR
        - WheelSpin Mad Mike
        - Gastar Wheelspins
        - Interface ou inicialização
        - Captura, OCR ou visão
        - Outro
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Modo de execução
      options:
        - Primeiro plano
        - Segundo plano (experimental)
        - Não se aplica
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão
      description: "Exemplo: v0.1.0."
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente do jogo
      description: Informe Windows, resolução, FPS aproximado e confirme o idioma pt-BR.
      placeholder: Windows 11; 1920x1080; 60 FPS; jogo em pt-BR
    validations:
      required: true
  - type: input
    id: attempt
    attributes:
      label: Tentativa ou estado registrado
      description: Para Farm de CR, informe o número/ID da tentativa e Prediction/GroundTruth/Outcome, se aparecerem no log.
      placeholder: Attempt 9; Prediction Unknown; outcome RejectedByModel
  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
      description: Explique onde o fluxo parou ou tomou uma decisão incorreta.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir
      description: Informe a tela inicial, o carro, as configurações e a sequência que levou ao erro.
      placeholder: |
        1. Iniciei na rua...
        2. Selecionei Skill Points...
        3. Pressionei F8...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log relevante
      description: Cole apenas o trecho necessário e remova dados pessoais.
      render: text
  - type: textarea
    id: additional
    attributes:
      label: Contexto adicional
      description: Não envie o dataset. Anexe uma imagem somente se for indispensável e depois de ocultar gamertag, saldo e outros dados pessoais.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmações
      options:
        - label: Verifiquei que não existe uma issue aberta sobre o mesmo problema.
          required: true
        - label: Removi informações pessoais, credenciais e tokens do conteúdo enviado.
          required: true
        - label: Não anexei `ExemplosPosition`, logs completos ou capturas brutas da minha tela.
          required: true
