name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore .\FH6OpenAssist.csproj -r win-x64

      - name: Compilar e validar os pacotes de Release
        run: .\scripts\build-release.ps1 -Version 0.0.0-ci -NoRestore -OutputDirectory .\artifacts\release
