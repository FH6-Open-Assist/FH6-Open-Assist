name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore .\FH6OpenAssist.csproj -r win-x64

      - name: Compilar e validar os pacotes de Release
        run: .\scripts\build-release.ps1 -Version 0.0.0-ci -NoRestore -OutputDirectory .\artifacts\release
